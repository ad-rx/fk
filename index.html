    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }

            background-size: 30px 30px;
            background-image: 
                linear-gradient(to right, rgba(226, 232, 240, 0.4) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(226, 232, 240, 0.4) 1px, transparent 1px);
        }

            height: 6px;

<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col selection:bg-sky-500 selection:text-white">

    <header id="app-header" class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200 px-4 lg:px-8 py-3 transition-all duration-300">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            <!-- App Identity -->
            <div class="flex items-center gap-3 cursor-pointer" onclick="app.navigateTo('DASHBOARD')">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-600 via-indigo-600 to-purple-600 flex items-center justify-center text-white shadow-md shadow-sky-500/20">
                    <i class="fa-solid fa-chart-line text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-900 text-base leading-tight flex items-center gap-2">
                        PARABOLA MASTER
                        <span class="text-[10px] font-extrabold uppercase bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full tracking-wider border border-emerald-300">TERPADU JSIT</span>
                    </h1>
                    <p class="text-xs text-slate-500 font-medium">Fungsi Kuadrat SMA Kelas X/XI</p>
                </div>
            </div>

            <!-- TERPADU Progress Indicator Bar (Desktop) -->
            <div id="terpadu-nav-bar" class="hidden xl:flex items-center gap-1 bg-slate-100 p-1.5 rounded-2xl border border-slate-200/80 text-xs font-semibold">
                <!-- Dynamic Stage Badges rendered by JS -->
            </div>

            <!-- User Quick Stats & Audio Controls -->
            <div class="flex items-center gap-3">
                <button id="btn-audio-toggle" onclick="audioEngine.toggleMute()" class="w-9 h-9 rounded-xl border border-slate-200 bg-white text-slate-600 hover:text-sky-600 hover:bg-slate-50 flex items-center justify-center transition-all" title="Efek Suara">
                    <i id="audio-icon" class="fa-solid fa-volume-high"></i>
                </button>

                <div id="user-pill-info" class="hidden flex items-center gap-2.5 bg-slate-100/90 hover:bg-slate-200/70 p-1.5 pr-3 rounded-2xl border border-slate-200 transition-all cursor-pointer" onclick="app.navigateTo('PROFILE')">
                    <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-500 text-white font-bold flex items-center justify-center text-xs shadow-sm" id="nav-avatar-initial">
                        A
                    </div>
                    <div class="text-left">
                        <div class="flex items-center gap-1.5">
                            <span id="nav-user-name" class="font-bold text-slate-800 text-xs max-w-[90px] truncate">Ahmad</span>
                            <span id="nav-user-level" class="bg-amber-100 text-amber-800 text-[10px] px-1.5 py-0.2 rounded font-extrabold">Lvl 1</span>
                        </div>
                        <div class="text-[11px] text-sky-600 font-bold flex items-center gap-1">
                            <i class="fa-solid fa-star text-amber-500 text-[10px]"></i>
                            <span id="nav-user-xp">0</span> XP
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main id="app-viewport" class="flex-grow flex flex-col relative">
        <!-- Views are rendered dynamically into this container -->
    </main>

    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <div id="modal-container" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div id="modal-content" class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 transform transition-all scale-95 opacity-0">
            <!-- Modal body dynamically injected -->
        </div>
    </div>

    <script>
        const MathEngine = {
            // y = a*x^2 + b*x + c
            getVertex(a, b, c) {
                if (a === 0) return { x: 0, y: c };
                const xv = -b / (2 * a);
                const yv = a * xv * xv + b * xv + c;
                return { x: parseFloat(xv.toFixed(2)), y: parseFloat(yv.toFixed(2)) };
            },
            getDiscriminant(a, b, c) {
                return (b * b) - (4 * a * c);
            },
            getRoots(a, b, c) {
                const D = this.getDiscriminant(a, b, c);
                if (D < 0) return [];
                if (D === 0) {
                    const r = -b / (2 * a);
                    return [parseFloat(r.toFixed(2))];
                }
                const r1 = (-b + Math.sqrt(D)) / (2 * a);
                const r2 = (-b - Math.sqrt(D)) / (2 * a);
                return [parseFloat(r1.toFixed(2)), parseFloat(r2.toFixed(2))].sort((x, y) => x - y);
            },
            getYIntercept(c) {
                return { x: 0, y: c };
            },
            getAxisOfSymmetry(a, b) {
                if (a === 0) return 0;
                return parseFloat((-b / (2 * a)).toFixed(2));
            },
            getDirection(a) {
                return a > 0 ? "Membuka ke Atas (Nilai Min)" : "Membuka ke Bawah (Nilai Maks)";
            }
        };

        class AudioFxEngine {
            constructor() {
                this.muted = false;
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
            }
            toggleMute() {
                this.muted = !this.muted;
                const icon = document.getElementById('audio-icon');
                if (icon) {
                    icon.className = this.muted ? "fa-solid fa-volume-xmark text-rose-500" : "fa-solid fa-volume-high text-slate-600";
                }
                app.showToast(this.muted ? "Suara Dimatikan" : "Suara Diaktifkan", "info");
            }
            playTone(freq, type = 'sine', duration = 0.15, gainVal = 0.1) {
                if (this.muted) return;
                try {
                    this.init();
                    if (this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) { console.error(e); }
            }
            playSuccess() {
                this.playTone(523.25, 'triangle', 0.1, 0.15); // C5
                setTimeout(() => this.playTone(659.25, 'triangle', 0.15, 0.15), 100); // E5
                setTimeout(() => this.playTone(783.99, 'triangle', 0.25, 0.2), 200); // G5
            }
            playLevelUp() {
                const notes = [440, 554.37, 659.25, 880];
                notes.forEach((freq, idx) => {
                    setTimeout(() => this.playTone(freq, 'sine', 0.2, 0.2), idx * 120);
                });
            }
            playError() {
                this.playTone(220, 'sawtooth', 0.2, 0.15);
                setTimeout(() => this.playTone(196, 'sawtooth', 0.25, 0.15), 150);
            }
            playClick() {
                this.playTone(800, 'sine', 0.05, 0.05);
            }
        }
        const audioEngine = new AudioFxEngine();

        class StudentStore {
            constructor() {
                this.STORAGE_KEY = 'parabola_master_students_v1';
                this.CURRENT_USER_KEY = 'parabola_master_current_id_v1';
                this.students = this.loadStudents();
                this.currentStudentId = localStorage.getItem(this.CURRENT_USER_KEY) || null;
            }
            loadStudents() {
                try {
                    const data = localStorage.getItem(this.STORAGE_KEY);
                    return data ? JSON.parse(data) : {};
                } catch(e) { return {}; }
            }
            saveStudents() {
                try {
                    localStorage.setItem(this.STORAGE_KEY, JSON.stringify(this.students));
                } catch(e) {}
            }
            generateId(name, studentClass) {
                return (name.trim().toLowerCase() + '_' + studentClass.trim().toLowerCase()).replace(/[^a-z0-9_]/g, '');
            }
            loginOrCreate(name, studentClass) {
                const id = this.generateId(name, studentClass);
                if (!this.students[id]) {
                    this.students[id] = {
                        student_id: id,
                        name: name.trim(),
                        class: studentClass.trim(),
                        xp: 0,
                        level: 1,
                        mastery: 10,
                        badges: ['detektif'],
                        completedStages: [],
                        stageProgress: {
                            TELAAH: false,
                            EKSPLORASI: false,
                            RUMUSKAN: false,
                            PRESENTASIKAN: false,
                            APLIKASIKAN: false,
                            DUNIAWI: false,
                            UKHROWI: false
                        },
                        reflections: [],
                        attempts: [],
                        created_at: new Date().toISOString()
                    };
                }
                this.currentStudentId = id;
                localStorage.setItem(this.CURRENT_USER_KEY, id);
                this.saveStudents();
                return this.students[id];
            }
            getCurrentStudent() {
                if (!this.currentStudentId || !this.students[this.currentStudentId]) return null;
                return this.students[this.currentStudentId];
            }
            updateStudent(updaterFn) {
                const student = this.getCurrentStudent();
                if (!student) return;
                updaterFn(student);
                // Level calculations: Level up every 100 XP
                const newLevel = Math.floor(student.xp / 100) + 1;
                if (newLevel > student.level) {
                    student.level = newLevel;
                    audioEngine.playLevelUp();
                    app.showToast(`🎉 SLAAMAT! Kamu naik ke Level ${newLevel}!`, 'success');
                }
                this.saveStudents();
            }
            addXP(amount, reason = "") {
                this.updateStudent(s => {
                    s.xp += amount;
                });
                audioEngine.playSuccess();
                if (reason) app.showToast(`+${amount} XP: ${reason}`, 'xp');
            }
            unlockBadge(badgeId, badgeTitle) {
                let isNew = false;
                this.updateStudent(s => {
                    if (!s.badges.includes(badgeId)) {
                        s.badges.push(badgeId);
                        isNew = true;
                    }
                });
                if (isNew) {
                    audioEngine.playLevelUp();
                    app.showModal(`
                        <div class="text-center py-4">
                            <div class="w-20 h-20 bg-amber-100 border-4 border-amber-400 rounded-full flex items-center justify-center text-amber-600 text-3xl mx-auto mb-3 animate-bounce shadow-lg">
                                <i class="fa-solid fa-award"></i>
                            </div>
                            <h3 class="text-xl font-extrabold text-slate-800">Lencana Baru Terbuka!</h3>
                            <p class="text-amber-600 font-bold text-lg mt-1">"${badgeTitle}"</p>
                            <p class="text-slate-500 text-xs mt-2">Hebat! Teruskan semangat belajar matematika kamu!</p>
                            <button onclick="app.closeModal()" class="mt-5 px-6 py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl text-sm transition-all shadow-md">
                                Lanjutkan Petualangan
                            </button>
                        </div>
                    `);
                }
            }
            markStageComplete(stageKey) {
                this.updateStudent(s => {
                    s.stageProgress[stageKey] = true;
                    if (!s.completedStages.includes(stageKey)) {
                        s.completedStages.push(stageKey);
                        // Calculate overall mastery percentage
                        s.mastery = Math.min(100, Math.round((s.completedStages.length / 7) * 100));
                    }
                });
            }
        }
        const studentStore = new StudentStore();

        class AppEngine {
            constructor() {
                this.currentView = 'LANDING';
                this.terpaduStages = [
                    { key: 'TELAAH', label: '1. TELAAH', icon: 'fa-magnifying-glass', desc: 'Pengamatan Masalah Nyata' },
                    { key: 'EKSPLORASI', label: '2. EKSPLORASI', icon: 'fa-sliders', desc: 'Eksperimen Parabola' },
                    { key: 'RUMUSKAN', label: '3. RUMUSKAN', icon: 'fa-lightbulb', desc: 'Konstruksi Rumus & Diskriminan' },
                    { key: 'PRESENTASIKAN', label: '4. PRESENTASIKAN', icon: 'fa-chalkboard-user', desc: 'Penjelasan Alur Pikir' },
                    { key: 'APLIKASIKAN', label: '5. APLIKASIKAN', icon: 'fa-list-check', desc: 'Problem Solving Bertahap' },
                    { key: 'DUNIAWI', label: '6. DUNIAWI', icon: 'fa-earth-asia', desc: 'Optimasi Taman & Bola' },
                    { key: 'UKHROWI', label: '7. UKHROWI', icon: 'fa-hands-praying', desc: 'Refleksi Keteraturan Ilahi' }
                ];
            }

            init() {
                const currentStudent = studentStore.getCurrentStudent();
                if (currentStudent) {
                    this.navigateTo('DASHBOARD');
                } else {
                    this.navigateTo('LANDING');
                }
            }

            showToast(message, type = 'info') {
                const container = document.getElementById('toast-container');
                if (!container) return;
                const toast = document.createElement('div');
                
                let bg = 'bg-slate-900 text-white';
                let icon = 'fa-circle-info text-sky-400';
                if (type === 'success') { bg = 'bg-emerald-800 text-white'; icon = 'fa-circle-check text-emerald-300'; }
                if (type === 'xp') { bg = 'bg-gradient-to-r from-amber-600 to-amber-700 text-white'; icon = 'fa-star text-amber-200'; }
                if (type === 'error') { bg = 'bg-rose-800 text-white'; icon = 'fa-triangle-exclamation text-rose-300'; }

                toast.className = `${bg} px-4 py-3 rounded-2xl shadow-xl border border-white/10 flex items-center gap-3 text-xs font-semibold transform transition-all duration-300 translate-y-4 opacity-0 pointer-events-auto`;
                toast.innerHTML = `<i class="fa-solid ${icon} text-base"></i> <span>${message}</span>`;
                
                container.appendChild(toast);
                setTimeout(() => {
                    toast.classList.remove('translate-y-4', 'opacity-0');
                }, 10);
                setTimeout(() => {
                    toast.classList.add('translate-y-4', 'opacity-0');
                    setTimeout(() => toast.remove(), 300);
                }, 3200);
            }

            showModal(htmlContent) {
                const modal = document.getElementById('modal-container');
                const content = document.getElementById('modal-content');
                content.innerHTML = htmlContent;
                modal.classList.remove('hidden');
                setTimeout(() => {
                    content.classList.remove('scale-95', 'opacity-0');
                    content.classList.add('scale-100', 'opacity-100');
                }, 10);
            }

            closeModal() {
                const modal = document.getElementById('modal-container');
                const content = document.getElementById('modal-content');
                content.classList.remove('scale-100', 'opacity-100');
                content.classList.add('scale-95', 'opacity-0');
                setTimeout(() => {
                    modal.classList.add('hidden');
                }, 200);
            }

            updateHeaderPill() {
                const student = studentStore.getCurrentStudent();
                const pill = document.getElementById('user-pill-info');
                const terpaduBar = document.getElementById('terpadu-nav-bar');

                if (student) {
                    pill.classList.remove('hidden');
                    pill.classList.add('flex');
                    document.getElementById('nav-avatar-initial').innerText = student.name.charAt(0).toUpperCase();
                    document.getElementById('nav-user-name').innerText = student.name;
                    document.getElementById('nav-user-level').innerText = `Lvl ${student.level}`;
                    document.getElementById('nav-user-xp').innerText = student.xp;

                    // Render Stage Bar
                    if (terpaduBar) {
                        terpaduBar.innerHTML = this.terpaduStages.map(stage => {
                            const isDone = student.stageProgress[stage.key];
                            const isActive = this.currentView === `STAGE_${stage.key}`;
                            let badgeClass = "bg-slate-200 text-slate-500 hover:bg-slate-300";
                            if (isDone) badgeClass = "bg-emerald-100 text-emerald-700 border border-emerald-300";
                            if (isActive) badgeClass = "bg-sky-600 text-white shadow-sm";
                            
                            return `
                                <button onclick="app.navigateToStage('${stage.key}')" class="px-2.5 py-1 rounded-xl transition-all flex items-center gap-1.5 ${badgeClass}" title="${stage.desc}">
                                    <i class="fa-solid ${stage.icon} text-[11px]"></i>
                                    <span>${stage.key}</span>
                                </button>
                            `;
                        }).join('');
                    }
                } else {
                    pill.classList.add('hidden');
                    if (terpaduBar) terpaduBar.innerHTML = '';
                }
            }

            navigateTo(viewName, params = {}) {
                this.currentView = viewName;
                audioEngine.playClick();
                this.updateHeaderPill();
                const viewport = document.getElementById('app-viewport');
                viewport.innerHTML = '';

                switch (viewName) {
                    case 'LANDING':
                        viewport.innerHTML = this.renderLandingPage();
                        this.initLandingCanvas();
                        break;
                    case 'DASHBOARD':
                        viewport.innerHTML = this.renderDashboard();
                        break;
                    case 'STAGE_TELAAH':
                        viewport.innerHTML = this.renderStageTelaah();
                        this.initTelaahCanvas();
                        break;
                    case 'STAGE_EKSPLORASI':
                        viewport.innerHTML = this.renderStageEksplorasi();
                        this.initExplorationCanvas();
                        break;
                    case 'STAGE_RUMUSKAN':
                        viewport.innerHTML = this.renderStageRumuskan();
                        break;
                    case 'STAGE_PRESENTASIKAN':
                        viewport.innerHTML = this.renderStagePresentasikan();
                        break;
                    case 'STAGE_APLIKASIKAN':
                        viewport.innerHTML = this.renderStageAplikasikan();
                        break;
                    case 'STAGE_DUNIAWI':
                        viewport.innerHTML = this.renderStageDuniawi();
                        this.initOptimizationCanvas();
                        break;
                    case 'STAGE_UKHROWI':
                        viewport.innerHTML = this.renderStageUkhrowi();
                        break;
                    case 'MINI_GAME':
                        viewport.innerHTML = this.renderMiniGame();
                        this.initMiniGameCanvas();
                        break;
                    case 'PROFILE':
                        viewport.innerHTML = this.renderProfileView();
                        break;
                    case 'CERTIFICATE':
                        viewport.innerHTML = this.renderCertificateView();
                        break;
                    default:
                        viewport.innerHTML = this.renderDashboard();
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            navigateToStage(stageKey) {
                const student = studentStore.getCurrentStudent();
                if (!student) return;
                
                // Allow free navigation or sequential check
                const stageIndex = this.terpaduStages.findIndex(s => s.key === stageKey);
                if (stageIndex > 0) {
                    const prevStageKey = this.terpaduStages[stageIndex - 1].key;
                    if (!student.stageProgress[prevStageKey] && !student.completedStages.includes(prevStageKey)) {
                        this.showToast(`Selesaikan tahap ${prevStageKey} terlebih dahulu!`, 'error');
                        return;
                    }
                }
                this.navigateTo(`STAGE_${stageKey}`);
            }

            renderLandingPage() {
                return `
                    <div class="flex-grow flex items-center justify-center p-4 lg:p-12 bg-grid-pattern relative overflow-hidden">
                        <!-- Background Glow Elements -->
                        <div class="absolute -top-32 -left-32 w-96 h-96 bg-sky-300/30 rounded-full filter blur-3xl pointer-events-none"></div>
                        <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-purple-300/30 rounded-full filter blur-3xl pointer-events-none"></div>

                        <div class="max-w-5xl w-full grid grid-cols-1 lg:grid-cols-12 gap-8 items-center relative z-10">
                            <!-- Hero Title Column -->
                            <div class="lg:col-span-7 space-y-6 text-center lg:text-left">
                                <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-sky-100 text-sky-800 border border-sky-200 text-xs font-bold">
                                    <i class="fa-solid fa-graduation-cap"></i> Media Pembelajaran Interaktif Matematika SMA
                                </div>
                                <h1 class="text-3xl sm:text-4xl lg:text-5xl font-black text-slate-900 leading-tight tracking-tight">
                                    MISSION: <br/>
                                    <span class="bg-gradient-to-r from-sky-600 via-indigo-600 to-purple-600 bg-clip-text text-transparent">MENAKLUKKAN PARABOLA</span>
                                </h1>
                                <p class="text-slate-600 text-sm sm:text-base leading-relaxed max-w-xl mx-auto lg:mx-0">
                                    Temukan pola. Bangun pemahaman visual. Gunakan keindahan matematika fungsi kuadrat untuk membaca keteraturan di alam ciptaan Allah SWT.
                                </p>

                                <!-- Interactive Parabola Preview Canvas -->
                                <div class="relative bg-white/80 rounded-3xl p-4 border border-slate-200 shadow-xl overflow-hidden group">
                                    <div class="absolute top-3 left-4 text-xs font-bold text-slate-400 flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span> Simulator Visual Real-time
                                    </div>
                                    <canvas id="landing-canvas" class="w-full h-44 rounded-2xl bg-slate-900/95 cursor-crosshair"></canvas>
                                </div>
                            </div>

                            <!-- Login / Identity Card -->
                            <div class="lg:col-span-5">
                                <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-2xl space-y-5">
                                    <div class="text-center space-y-1">
                                        <div class="w-12 h-12 bg-sky-100 text-sky-600 rounded-2xl flex items-center justify-center text-xl font-bold mx-auto mb-2">
                                            <i class="fa-solid fa-user-astronaut"></i>
                                        </div>
                                        <h2 class="text-xl font-extrabold text-slate-900">Masuk Petualangan</h2>
                                        <p class="text-xs text-slate-500">Masukkan Nama & Kelas untuk memulai profil belajar</p>
                                    </div>

                                    <form onsubmit="app.handleLogin(event)" class="space-y-4">
                                        <div>
                                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Nama Lengkap Siswa</label>

            initLandingCanvas() {
                const canvas = document.getElementById('landing-canvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let t = 0;

                const animate = () => {
                    if (this.currentView !== 'LANDING') return;
                    canvas.width = canvas.offsetWidth;
                    canvas.height = canvas.offsetHeight;
                    const w = canvas.width;
                    const h = canvas.height;

                    ctx.clearRect(0, 0, w, h);

                    // Draw Grid
                    ctx.strokeStyle = '#1e293b';
                    ctx.lineWidth = 1;
                    for (let x = 0; x < w; x += 25) {
                        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
                    }
                    for (let y = 0; y < h; y += 25) {
                        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
                    }

                    // Dynamic Parabola: y = a*(x - h)^2 + k
                    const cx = w / 2 + Math.sin(t * 0.03) * 40;
                    const cy = h / 2 + Math.cos(t * 0.02) * 20;
                    const a = 0.015 * Math.sin(t * 0.04);

                    ctx.strokeStyle = '#0ea5e9';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    for (let px = 0; px <= w; px += 2) {
                        const py = a * Math.pow(px - cx, 2) + cy;
                        if (px === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.stroke();

                    // Glowing Vertex Point
                    const vertexY = cy;
                    ctx.fillStyle = '#f59e0b';
                    ctx.beginPath();
                    ctx.arc(cx, vertexY, 6, 0, Math.PI * 2);
                    ctx.fill();

                    t++;
                    requestAnimationFrame(animate);
                };
                animate();
            }

            updateTelaahSimulation() {
                const canvas = document.getElementById('telaah-canvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
                const w = canvas.width;
                const h = canvas.height;

                const speedEl = document.getElementById('slider-speed');
                const angleEl = document.getElementById('slider-angle');
                if (!speedEl || !angleEl) return;

                const speed = parseFloat(speedEl.value);
                const angleDeg = parseFloat(angleEl.value);
                document.getElementById('val-speed').innerText = speed;
                document.getElementById('val-angle').innerText = angleDeg;

                const angleRad = (angleDeg * Math.PI) / 180;
                const g = 9.8; // Gravity

                ctx.clearRect(0, 0, w, h);

                // Draw ground
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(0, h - 30); ctx.lineTo(w, h - 30); ctx.stroke();

                // Projectile math scaled to canvas
                const v0x = speed * Math.cos(angleRad);
                const v0y = speed * Math.sin(angleRad);
                const totalTime = (2 * v0y) / g;

                const originX = 40;
                const originY = h - 30;

                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 3;
                ctx.beginPath();

                let maxY = 0;
                let maxPt = { x: originX, y: originY };

                for (let t = 0; t <= totalTime; t += 0.05) {
                    const x = originX + (v0x * t) * 12;
                    const y = originY - ((v0y * t) - (0.5 * g * t * t)) * 12;
                    if (t === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);

                    if ((originY - y) > maxY) {
                        maxY = originY - y;
                        maxPt = { x, y };
                    }
                }
                ctx.stroke();

                // Draw Vertex Point
                ctx.fillStyle = '#f59e0b';
                ctx.beginPath();
                ctx.arc(maxPt.x, maxPt.y, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#fbbf24';
                ctx.font = 'bold 10px sans-serif';
                ctx.fillText(`Titik Puncak (Ketinggian Maksimum)`, maxPt.x - 70, maxPt.y - 12);

                // Draw Hoop Basket
                const hoopX = w - 60;
                const hoopY = h - 90;
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(hoopX, hoopY, 25, 6);
            }

            updateExplorationCanvas() {
                const canvas = document.getElementById('exploration-canvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
                const w = canvas.width;
                const h = canvas.height;

                const a = parseFloat(document.getElementById('slider-a').value);
                const b = parseFloat(document.getElementById('slider-b').value);
                const c = parseFloat(document.getElementById('slider-c').value);

                document.getElementById('val-a').innerText = a;
                document.getElementById('val-b').innerText = b;
                document.getElementById('val-c').innerText = c;

                // Update text formula
                const signB = b >= 0 ? `+ ${b}` : `- ${Math.abs(b)}`;
                const signC = c >= 0 ? `+ ${c}` : `- ${Math.abs(c)}`;
                document.getElementById('exp-equation-display').innerText = `y = ${a}x² ${signB}x ${signC}`;

                // Compute Math Properties
                const vertex = MathEngine.getVertex(a, b, c);
                const axis = MathEngine.getAxisOfSymmetry(a, b);
                const yint = MathEngine.getYIntercept(c);
                const dir = MathEngine.getDirection(a);

                document.getElementById('prop-vertex').innerText = `(${vertex.x}, ${vertex.y})`;
                document.getElementById('prop-axis').innerText = `x = ${axis}`;
                document.getElementById('prop-yint').innerText = `(0, ${yint.y})`;
                document.getElementById('prop-dir').innerText = a > 0 ? 'Ke Atas (Min)' : (a < 0 ? 'Ke Bawah (Maks)' : 'Garis Lurus');

                // Draw Coordinate Plane
                ctx.clearRect(0, 0, w, h);
                const scale = 20; // 20px per math unit
                const cx = w / 2;
                const cy = h / 2;

                // Draw Grid
                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 1;
                for (let x = cx % scale; x < w; x += scale) {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
                }
                for (let y = cy % scale; y < h; y += scale) {
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
                }

                // Axes
                ctx.strokeStyle = '#64748b';
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(w, cy); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, h); ctx.stroke();

                if (a !== 0) {
                    // Draw Parabola Curve
                    ctx.strokeStyle = '#0ea5e9';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    let started = false;
                    for (let px = 0; px <= w; px += 2) {
                        const xVal = (px - cx) / scale;
                        const yVal = a * Math.pow(xVal, 2) + b * xVal + c;
                        const py = cy - (yVal * scale);

                        if (!started) { ctx.moveTo(px, py); started = true; }
                        else ctx.lineTo(px, py);
                    }
                    ctx.stroke();

                    // Axis of Symmetry Line (Dashed)
                    const axisPx = cx + (axis * scale);
                    ctx.strokeStyle = '#a855f7';
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath(); ctx.moveTo(axisPx, 0); ctx.lineTo(axisPx, h); ctx.stroke();
                    ctx.setLineDash([]);

                    // Highlight Vertex Node
                    const vPx = cx + (vertex.x * scale);
                    const vPy = cy - (vertex.y * scale);
                    ctx.fillStyle = '#f59e0b';
                    ctx.beginPath(); ctx.arc(vPx, vPy, 6, 0, Math.PI * 2); ctx.fill();

                    // Highlight Y-Intercept Node
                    const yintPy = cy - (c * scale);
                    ctx.fillStyle = '#10b981';
                    ctx.beginPath(); ctx.arc(cx, yintPy, 5, 0, Math.PI * 2); ctx.fill();
                }
            }

            updateOptimizationCanvas() {
                const canvas = document.getElementById('opt-canvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
                const w = canvas.width;
                const h = canvas.height;

                const slider = document.getElementById('opt-slider-x');
                if (!slider) return;
                const x = parseFloat(slider.value);
                const width = 20 - x;
                const area = x * width;

                document.getElementById('opt-val-x').innerText = x;
                document.getElementById('opt-width').innerText = `${width} meter`;
                document.getElementById('opt-area').innerText = `${area} m²`;

                ctx.clearRect(0, 0, w, h);

                // Draw Parabola y = -x^2 + 20x
                const cx = 50;
                const cy = h - 40;
                const scaleX = (w - 100) / 20;
                const scaleY = (h - 80) / 105;

                // Parabola line
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 3;
                ctx.beginPath();
                for (let px = 0; px <= 20; px += 0.2) {
                    const py = -Math.pow(px, 2) + (20 * px);
                    const drawX = cx + (px * scaleX);
                    const drawY = cy - (py * scaleY);
                    if (px === 0) ctx.moveTo(drawX, drawY);
                    else ctx.lineTo(drawX, drawY);
                }
                ctx.stroke();

                // Draw Active Point on Curve
                const curDrawX = cx + (x * scaleX);
                const curDrawY = cy - (area * scaleY);

                ctx.fillStyle = '#f59e0b';
                ctx.beginPath();
                ctx.arc(curDrawX, curDrawY, 7, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#fbbf24';
                ctx.font = 'bold 11px sans-serif';
                ctx.fillText(`Luas: ${area}m²`, curDrawX - 30, curDrawY - 15);
            }

            initMiniGameCanvas() {
                const canvas = document.getElementById('game-canvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
                const w = canvas.width;
                const h = canvas.height;

                // Random Parabola y = a(x - h)^2 + k
                const hVal = Math.floor(Math.random() * 6) - 3;
                const kVal = Math.floor(Math.random() * 6) - 3;
                const aVal = Math.random() > 0.5 ? 0.5 : -0.5;

                ctx.clearRect(0, 0, w, h);
                const scale = 22;
                const cx = w / 2;
                const cy = h / 2;

                // Grid
                ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1;
                for (let x = 0; x < w; x += scale) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
                for (let y = 0; y < h; y += scale) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

                // Axes
                ctx.strokeStyle = '#475569'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(w, cy); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, h); ctx.stroke();

                // Curve
                ctx.strokeStyle = '#c084fc'; ctx.lineWidth = 3;
                ctx.beginPath();
                for (let px = 0; px <= w; px += 2) {
                    const xMath = (px - cx) / scale;
                    const yMath = aVal * Math.pow(xMath - hVal, 2) + kVal;
                    const py = cy - (yMath * scale);
                    if (px === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.stroke();

                // Target Click listener
                canvas.onclick = (e) => {
                    const rect = canvas.getBoundingClientRect();
                    const clickX = e.clientX - rect.left;
                    const clickY = e.clientY - rect.top;

                    const targetPx = cx + (hVal * scale);
                    const targetPy = cy - (kVal * scale);

                    const dist = Math.hypot(clickX - targetPx, clickY - targetPy);
                    if (dist < 20) {
                        studentStore.addXP(15, "Tebakan Puncak Tepat!");
                        const scoreEl = document.getElementById('game-score');
                        if (scoreEl) scoreEl.innerText = parseInt(scoreEl.innerText) + 15;
                        this.showToast("🎉 TEPAT! Koordinat Titik Puncak Ditemukan!", "success");
                        this.initMiniGameCanvas();
                    } else {
                        audioEngine.playError();
                        this.showToast("Coba perhatikan lebih teliti posisi puncaknya!", "error");
                    }
                };
            }
